{% extends 'shop/base.html' %}

{% block title %}Оформление заказа{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center mt-5">
        <div class="card shadow-sm">
            <div class="card-body py-5">
                <h1 class="display-4 text-success mb-4">✅</h1>
                <h3 class="mb-3">Заказ успешно оформлен!</h3>
                <p class="text-muted">Ваш заказ принят в обработку. Вы можете отследить его статус в разделе «Мои заказы».</p>
                <div class="mt-4">
                    <a href="{% url 'order-list' %}" class="btn btn-primary me-2">Мои заказы</a>
                    <a href="{% url 'product-list' %}" class="btn btn-outline-secondary">Вернуться в каталог</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
